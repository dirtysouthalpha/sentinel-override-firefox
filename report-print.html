<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sentinel Override — Investigation Report</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: white;
      color: #111;
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 36px;
      line-height: 1.6;
      font-size: 13.5px;
    }
    .meta {
      border-bottom: 2px solid #2a6ce0;
      padding-bottom: 12px;
      margin-bottom: 24px;
    }
    .meta .brand { font-weight: 700; color: #2a6ce0; font-size: 18px; letter-spacing: 0.5px; }
    .meta .timestamp { color: #666; font-size: 11.5px; margin-top: 4px; }
    .meta .goal { color: #222; font-size: 13px; margin-top: 6px; font-style: italic; }
    h1 { font-size: 22px; margin: 24px 0 12px; color: #1a1a1a; border-bottom: 1px solid #ddd; padding-bottom: 6px; }
    h2 { font-size: 17px; margin: 20px 0 10px; color: #2a6ce0; }
    h3 { font-size: 14.5px; margin: 16px 0 8px; color: #444; }
    p { margin: 0 0 12px; }
    ul, ol { margin: 0 0 12px 20px; padding: 0; }
    li { margin-bottom: 4px; }
    code {
      background: #f4f4f4;
      padding: 1px 5px;
      border-radius: 3px;
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      font-size: 12px;
    }
    pre {
      background: #f7f7f7;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 10px 12px;
      overflow-x: auto;
      font-size: 11.5px;
      line-height: 1.45;
    }
    pre code { background: none; padding: 0; }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 12px 0;
      font-size: 12px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 6px 10px;
      text-align: left;
    }
    th {
      background: #f0f0f0;
      font-weight: 600;
    }
    blockquote {
      border-left: 3px solid #2a6ce0;
      margin: 12px 0;
      padding: 4px 0 4px 14px;
      color: #555;
      font-style: italic;
    }
    a { color: #2a6ce0; text-decoration: none; }
    a:hover { text-decoration: underline; }
    /* Source-citation chips render as inline subtle badges in print */
    .src-chip {
      display: inline;
      background: #fff4e5;
      color: #b85c00;
      border: 1px solid #ffd6a8;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 10.5px;
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      margin-left: 4px;
    }
    .src-unverified {
      display: inline;
      background: #fde7e7;
      color: #b00020;
      border: 1px solid #f3b8b8;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 10.5px;
      margin-left: 4px;
    }
    footer {
      margin-top: 32px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
      font-size: 11px;
      color: #888;
      text-align: center;
    }
    @media print {
      body { padding: 24px 30px; }
      h1, h2, h3 { page-break-after: avoid; }
      pre, table, blockquote { page-break-inside: avoid; }
      a { color: #111; text-decoration: none; }
    }
    @page { margin: 0.6in 0.5in; }
    .loading { text-align: center; color: #888; padding: 60px 0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="meta">
    <div class="brand">SENTINEL OVERRIDE — Investigation Report</div>
    <div class="goal" id="reportGoal"></div>
    <div class="timestamp" id="reportTimestamp"></div>
  </div>
  <div id="reportBody">
    <div class="loading">Loading report...</div>
  </div>
  <footer>
    Generated by Sentinel Override. Cite-tagged claims [src:key] reference the agent's extracted memory entries; full evidence is in the run log.
  </footer>

  <!-- marked.js bundled locally for markdown rendering -->
  <script src="lib/marked.min.js"></script>
  <script src=report-print.js></script>
</body>
</html>
