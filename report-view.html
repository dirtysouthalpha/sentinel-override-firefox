<!DOCTYPE html>
<!-- (3.20.2) Full-tab investigation report view. Replaces the in-panel
     modal so the report doesn't cover the chat sidebar. Reads the report
     from chrome.storage.local._pendingViewReport. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sentinel Override — Investigation Report</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --bg-secondary: #232323;
      --bg-tertiary: #2c2c2c;
      --text: #e8e8e8;
      --text-secondary: #aaa;
      --text-tertiary: #777;
      --border: #3a3a3a;
      --accent: #ff6b00;
      --accent-hover: #ff8a30;
      --code-bg: #131313;
      --chip-bg: rgba(255,107,0,0.12);
      --chip-text: #ffb070;
      --chip-border: rgba(255,107,0,0.35);
      --warn-bg: rgba(220,53,69,0.12);
      --warn-text: #ff8080;
      --warn-border: rgba(220,53,69,0.4);
    }
    html.light-mode {
      --bg: #ffffff;
      --bg-secondary: #f7f7f7;
      --bg-tertiary: #ececec;
      --text: #111;
      --text-secondary: #555;
      --text-tertiary: #888;
      --border: #ddd;
      --accent: #2a6ce0;
      --accent-hover: #1a5cd0;
      --code-bg: #f4f4f4;
      --chip-bg: #fff4e5;
      --chip-text: #b85c00;
      --chip-border: #ffd6a8;
      --warn-bg: #fde7e7;
      --warn-text: #b00020;
      --warn-border: #f3b8b8;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      line-height: 1.65;
      font-size: 14px;
      min-height: 100vh;
    }

    /* Sticky header with the report toolbar */
    header.toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .toolbar .brand {
      font-weight: 700;
      color: var(--accent);
      font-size: 16px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .toolbar .timestamp {
      color: var(--text-tertiary);
      font-size: 12px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .toolbar button {
      background: var(--bg-tertiary);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 120ms, border-color 120ms;
    }
    .toolbar button:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .toolbar button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .toolbar button.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    /* Goal banner directly under the toolbar */
    .goal-banner {
      padding: 14px 24px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-secondary);
      font-style: italic;
      line-height: 1.5;
    }
    .goal-banner .label {
      font-style: normal;
      font-weight: 600;
      font-size: 10px;
      letter-spacing: 0.5px;
      color: var(--text-tertiary);
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px;
    }

    /* Main report column */
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 28px 80px;
    }

    h1 { font-size: 26px; margin: 28px 0 14px; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    h1:first-child { margin-top: 0; }
    h2 { font-size: 19px; margin: 24px 0 10px; color: var(--accent); }
    h3 { font-size: 15.5px; margin: 18px 0 8px; color: var(--text-secondary); }
    p { margin: 0 0 12px; }
    ul, ol { margin: 0 0 14px 22px; padding: 0; }
    li { margin-bottom: 6px; }
    strong { color: var(--text); }
    em { color: var(--text-secondary); }
    code {
      background: var(--code-bg);
      padding: 1.5px 6px;
      border-radius: 3px;
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      font-size: 12.5px;
      color: var(--accent);
    }
    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      overflow-x: auto;
      font-size: 12px;
      line-height: 1.5;
    }
    pre code { background: none; padding: 0; color: var(--text); }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 14px 0;
      font-size: 12.5px;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }
    th { background: var(--bg-tertiary); font-weight: 600; color: var(--text); }
    blockquote {
      border-left: 3px solid var(--accent);
      margin: 14px 0;
      padding: 6px 0 6px 16px;
      color: var(--text-secondary);
      font-style: italic;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    /* Source-citation chips */
    .src-chip {
      display: inline-block;
      background: var(--chip-bg);
      color: var(--chip-text);
      border: 1px solid var(--chip-border);
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 11px;
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      margin: 0 2px;
      cursor: help;
    }
    .src-unverified {
      display: inline-block;
      background: var(--warn-bg);
      color: var(--warn-text);
      border: 1px solid var(--warn-border);
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 11px;
      margin: 0 2px;
    }

    .loading { text-align: center; color: var(--text-tertiary); padding: 80px 0; font-size: 14px; }

    /* Theme toggle button - inline svg, no external deps */
    .theme-btn { padding: 6px 10px !important; }
    .theme-btn svg { width: 14px; height: 14px; vertical-align: middle; }

    @media (max-width: 720px) {
      header.toolbar { padding: 10px 14px; gap: 8px; flex-wrap: wrap; }
      .toolbar .brand { font-size: 14px; }
      .toolbar .timestamp { display: none; }
      .toolbar button { padding: 6px 10px; font-size: 11px; }
      main { padding: 20px 16px 60px; }
    }

    @media print {
      header.toolbar, .goal-banner .label { display: none; }
      body { background: #fff; color: #000; }
      main { max-width: none; padding: 20px; }
      a { color: #000; text-decoration: none; }
      .src-chip, .src-unverified { font-size: 9px; }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <span class="brand">SENTINEL OVERRIDE — Report</span>
    <span class="timestamp" id="reportTimestamp"></span>
    <button id="copyMdBtn" title="Copy the full markdown source to your clipboard">Copy Markdown</button>
    <button id="downloadMdBtn" title="Download as .md file">Download .md</button>
    <button id="downloadJsonBtn" title="Download structured JSON data">Download JSON</button>
    <button id="printBtn" title="Print or Save as PDF">Print / PDF</button>
    <button id="themeBtn" class="theme-btn" title="Toggle light / dark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>
  </header>
  <div class="goal-banner" id="goalBanner" style="display:none;">
    <span class="label">Goal</span>
    <span id="reportGoal"></span>
  </div>
  <main>
    <div id="reportBody">
      <div class="loading">Loading report…</div>
    </div>
  </main>

  <script src="lib/marked.min.js"></script>
  <script>
    // Theme: respect the user's theme-preference from the popup if available;
    // default to dark for a comfortable reading experience.
    (function initTheme() {
      try {
        chrome.storage.local.get(['theme-preference'], (r) => {
          if (r && r['theme-preference'] === 'light') {
            document.documentElement.classList.add('light-mode');
          }
        });
      } catch (e) {
        // localStorage fallback
        try {
          if (localStorage.getItem('theme-preference') === 'light') {
            document.documentElement.classList.add('light-mode');
          }
        } catch (ee) {}
      }
    })();

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    let __currentReport = null;

    (async function loadReport() {
      try {
        const stored = await chrome.storage.local.get(['_pendingViewReport', '_pendingPrintReport', 'last_agent_report']);
        // Prefer the view-specific key, fall back to print key, fall back to last_agent_report
        const data = (stored && stored._pendingViewReport) ||
                     (stored && stored._pendingPrintReport) ||
                     (stored && stored.last_agent_report);
        if (!data || !data.fullReport) {
          document.getElementById('reportBody').innerHTML =
            '<div class="loading" style="color:var(--warn-text);">No report available. Run an agent task first, then click "View Full Report".</div>';
          return;
        }
        __currentReport = data;
        const goalEl = document.getElementById('reportGoal');
        const tsEl = document.getElementById('reportTimestamp');
        const banner = document.getElementById('goalBanner');
        if (data.goal) {
          goalEl.textContent = data.goal;
          banner.style.display = 'block';
        }
        if (data.timestamp) tsEl.textContent = new Date(data.timestamp).toLocaleString();

        const html = window.marked && window.marked.parse
          ? window.marked.parse(data.fullReport)
          : escapeHtml(data.fullReport).replace(/\n/g, '<br>');

        // Decorate [src:key] / [unverified] markers as inline chips for
        // audit trail visibility.
        const decorated = html
          .replace(/\[src:([a-z0-9_\-]+)\]/gi, '<span class="src-chip" title="Source: $1">$1</span>')
          .replace(/\[unverified\]/gi, '<span class="src-unverified">unverified</span>');

        document.getElementById('reportBody').innerHTML = decorated;
        document.title = 'Sentinel Override — ' + (data.goal ? data.goal.substring(0, 60) : 'Investigation Report');
      } catch (e) {
        document.getElementById('reportBody').innerHTML =
          '<div class="loading" style="color:var(--warn-text);">Error loading report: ' +
          escapeHtml(e && e.message ? e.message : String(e)) + '</div>';
      }
    })();

    // Button wiring
    document.getElementById('copyMdBtn').addEventListener('click', async () => {
      if (!__currentReport || !__currentReport.fullReport) return;
      try {
        await navigator.clipboard.writeText(__currentReport.fullReport);
        const btn = document.getElementById('copyMdBtn');
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = orig; }, 1500);
      } catch (e) {
        alert('Copy failed: ' + (e && e.message ? e.message : e));
      }
    });

    document.getElementById('downloadMdBtn').addEventListener('click', () => {
      if (!__currentReport || !__currentReport.fullReport) return;
      const timestamp = new Date().toISOString().replace(/[:.]/g, '-').substring(0, 19);
      const filename = `sentinel-report-${timestamp}.md`;
      const blob = new Blob([__currentReport.fullReport], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    });

    document.getElementById('downloadJsonBtn').addEventListener('click', () => {
      if (!__currentReport || !__currentReport.structuredData) return;
      const timestamp = new Date().toISOString().replace(/[:.]/g, '-').substring(0, 19);
      const filename = `sentinel-report-${timestamp}.json`;
      const json = JSON.stringify(__currentReport.structuredData, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    });

    document.getElementById('printBtn').addEventListener('click', () => {
      window.print();
    });

    document.getElementById('themeBtn').addEventListener('click', () => {
      document.documentElement.classList.toggle('light-mode');
      try {
        const isLight = document.documentElement.classList.contains('light-mode');
        chrome.storage.local.set({ 'theme-preference': isLight ? 'light' : 'dark' });
      } catch (e) {}
    });
  </script>
</body>
</html>
